# Azure PostgreSQL profile
# Activate with: SPRING_PROFILES_ACTIVE=azure  (plus DB_* env vars)
#
# Prerequisites:
# 1. Azure Portal → PostgreSQL server → Networking → add your client IP to the firewall
# 2. Set DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER, DB_DIALECT in the environment
# 3. Set ADMIN_INITIAL_PASSWORD before first startup (required if admin user does not exist)
# 4. For a brand-new empty database, run once with DDL_AUTO=update to create tables,
#    then remove DDL_AUTO or set it back to validate

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
