# ═ 🗄️ RELATIONAL DATABASE CONNECTION POOL (ENVIRONMENT INJECTED) ═
# Defaults point to a SAFE, LOCAL H2 database. Azure will override these with real secrets.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexstore_dev}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ═ ⚙️ HIBERNATE ORM PERFORMANCE & SCHEMAS ═
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
# Default is now "validate" (fail-safe). Hibernate will NOT auto-alter the schema
# unless an operator explicitly opts in via the DDL_AUTO env var (e.g. for local dev).
# Use Flyway/Liquibase migrations to evolve the schema in real environments instead
# of letting Hibernate guess — "update" can silently drop columns/constraints or
# lock tables on a live database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ═ 📦 AZURE BLOB STORAGE CONFIGURATION ═
spring.cloud.azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME:nexstorestorage2026}
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_ENDPOINT:https://nexstorestorage2026.blob.core.windows.net}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:product-images}

# ═ 🔌 HIKARICP PLATFORM OPTIMIZATIONS ═
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ═ ❌ DEACTIVATE VOLATILE IN-MEMORY CONSOLES ═
# Default is now "false" (fail-safe). Set H2_CONSOLE=true only in local/dev
# environments — if this were ever left unset in production, the console would
# have been silently exposed under the old default.
spring.h2.console.enabled=${H2_CONSOLE:false}

spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
